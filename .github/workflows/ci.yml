name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      # --extra rebuild so ty can resolve fit_tool in fitgraft.py.
      - run: uv run --locked --extra rebuild ty check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      # --extra rebuild so test_tracks.Rebuild and test_tracks.Valid run too.
      - run: uv run --locked --extra rebuild python -m unittest -v
